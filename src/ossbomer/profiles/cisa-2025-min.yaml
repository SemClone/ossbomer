# SUPERSEDED. This profile encodes the August 2025 draft, whose comment period
# closed on 2025-10-03. CISA published the final document on 2026-07-29 as the
# 2026 Minimum Elements, which "updates and replaces" the 2021 NTIA elements.
# Use `cisa-2026-min` for anything current. Kept because a document validated
# against the draft during the comment window should stay reproducible.
id: cisa-2025-min
name: CISA 2025 Draft SBOM Minimum Elements (superseded by cisa-2026-min)
version: "2025-08"
sources:
  - name: CISA
    ref: "CISA, 2025 Minimum Elements for a Software Bill of Materials (Draft), Section 3 (Data Fields). Superseded 2026-07-29 by the 2026 Minimum Elements."
    url: https://www.cisa.gov/resources-tools/resources/2025-minimum-elements-software-bill-materials-sbom
  - name: NTIA
    ref: "The Minimum Elements For a Software Bill of Materials (SBOM), 2021-07-12"
    url: https://www.ntia.gov/report/2021/minimum-elements-software-bill-materials-sbom

extends:
  - ntia-min-elements

schema:
  min_versions:
    spdx: "2.3"
    cyclonedx: "1.5"

rules:
  - id: cisa-tool-name
    scope: document
    severity: SHOULD
    category: Provenance
    citation: "CISA 2025 Draft §3: SBOM Author and generating tool"
    field: tools
    validators: [present, non_placeholder]

  - id: cisa-component-license
    scope: component
    severity: SHOULD
    category: Accuracy
    citation: "CISA 2025 Draft §3: License (recommended data field)"
    field: licenses
    validators: [present, spdx_license_expression]

  - id: cisa-component-hash
    scope: component
    severity: MUST_WHERE_AVAILABLE
    category: Accuracy
    citation: "CISA 2025 Draft §3: Cryptographic Hash of the Component"
    field: hashes
    validators:
      - name: hash_algorithm_in_set
        algs: [SHA-256, SHA-512]

scoring:
  weights:
    Completeness: 0.35
    Accuracy: 0.25
    Consistency: 0.15
    Provenance: 0.15
    Freshness: 0.10
  thresholds:
    version_coverage_min: 0.90
    noassertion_density_max: 0.15
