# WITHDRAWN. Do not use. Kept only so `--profile eu-cra-annex-vii` fails loudly
# instead of silently resolving to nothing for anyone with it in a CI pipeline.
#
# This profile cited Annex VII §8(a), §8(b) and §8(c). Those sub-points do not
# exist. Annex VII(8) is a single sentence, quoted in full:
#
#   "where applicable, the software bill of materials, further to a reasoned
#    request from a market surveillance authority provided that it is necessary
#    in order for that authority to be able to check compliance with the
#    essential cybersecurity requirements set out in Annex I."
#
# It names no data field. It is a disclosure trigger, not a content spec. The
# eight data-field rules previously here were not derived from the Regulation.
#
# The clause that does constrain SBOM content is Annex I Part II(1). Use
# `eu-cra-annex-i`.
id: eu-cra-annex-vii
name: "WITHDRAWN: cited a clause that does not exist -- use eu-cra-annex-i"
version: "withdrawn"
sources:
  - name: EU CRA
    ref: "WITHDRAWN. Annex VII(8) specifies no SBOM data fields; the cited sub-points §8(a)-(c) do not exist in Regulation (EU) 2024/2847. Superseded by the eu-cra-annex-i profile, which encodes Annex I Part II(1)."
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=OJ:L_202402847

# A profile with no rules asserts nothing. That is the point: a run against this
# id must not produce a conformance claim of any kind.
rules: []
