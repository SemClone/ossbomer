title: ossbomer
description: >-
  Profile-driven SBOM validation, conformance, and license policy for SPDX and
  CycloneDX. One profile binds schema minima, conformance rules, and license
  policy; each profile returns its own verdict and quality score.

# Pretty URLs that work both under GitHub Pages (served at /ossbomer/) and when
# previewing locally with `bundle exec jekyll serve`.
#
# `url` is the custom domain, not oscarvalenzuelab.github.io: an account-level
# CNAME means project pages are served from ovalenzuela.com, and github.io only
# 301s here. Pointing `url` at github.io made jekyll-seo-tag emit a canonical
# link and og:url for a host that redirects away from the page itself.
baseurl: /ossbomer
url: "https://ovalenzuela.com"

# Just the Docs as a remote theme, so GitHub Pages builds it for us without
# vendoring the theme files.
remote_theme: just-the-docs/just-the-docs

color_scheme: dark

# Sidebar / search configuration.
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  rel_url: true
  button: false

# Top-right aux links — always visible in the header.
aux_links:
  "GitHub":
    - "https://github.com/SemClone/ossbomer"
  "ospac":
    - "https://pypi.org/project/ospac/"
aux_links_new_tab: true

# Show "Edit this page on GitHub" links.
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/SemClone/ossbomer"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

# Enable callouts (the `{: .note }` syntax Just the Docs ships with).
callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green

# Skip tooling-only files so Jekyll doesn't try to render them.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - README.md

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
