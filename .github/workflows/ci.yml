name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    # Cheap guard: the community/packaging files the project promises are present.
    # Runs on every PR (no path filter), so it is safe to require in the ruleset.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check required files
        run: |
          missing=0
          for file in README.md LICENSE CHANGELOG.md AUTHORS.md CONTRIBUTING.md \
                      CODE_OF_CONDUCT.md SECURITY.md SUPPORT.md pyproject.toml; do
            if [ -f "$file" ]; then
              echo "  ok      $file"
            else
              echo "  MISSING $file"
              missing=1
            fi
          done
          exit $missing

  # Job name is load-bearing: `lint` is a required status check on main, so
  # renaming it would leave every PR waiting on a check that never reports.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: mypy
        # Installed as an editable package above, so third-party types resolve.
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the built wheel in a clean venv and smoke-test the CLI
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --upgrade pip
          /tmp/wheeltest/bin/pip install dist/*.whl
          echo "--- version ---";   /tmp/wheeltest/bin/ossbomer --version
          echo "--- profiles ---";  /tmp/wheeltest/bin/ossbomer profiles
          echo "--- validators ---"; /tmp/wheeltest/bin/ossbomer validators
          echo "--- validate (JSON) ---"
          # A FAIL verdict exits 1, which is expected; assert the run itself worked.
          /tmp/wheeltest/bin/ossbomer validate --format json \
            --profile ntia-min-elements --profile eu-cra-annex-vii \
            --file tests/fixtures/cyclonedx/valid/cdx-1.6.json || true
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: ossbomer-wheel
          path: dist/*.whl
          if-no-files-found: error
