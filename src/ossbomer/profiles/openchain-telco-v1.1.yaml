id: openchain-telco-v1.1
name: OpenChain Telco SBOM Quality v1.1
version: "1.1"
sources:
  - name: OpenChain Project
    ref: "OpenChain Telco SBOM Guide Version 1.1, §3 (SBOM formats), §4 (SBOM Elements / SBOM Data Format Requirements)"
    url: https://github.com/OpenChain-Project/Telco-WG
  - name: OpenChain Project
    ref: "OpenChain Telco SBOM Guide v1.1 §3.1 (Data Format: SPDX)"
    url: https://raw.githubusercontent.com/OpenChain-Project/Telco-WG/main/OpenChain-Telco-SBOM-Guide_EN.md

schema:
  min_versions:
    spdx: "2.3"

rules:
  - id: telco-author
    scope: document
    severity: MUST
    category: Provenance
    citation: "OpenChain Telco v1.1 §4: Creator (PersonName or OrganizationName)"
    field: creators
    validators: [present, non_placeholder]

  - id: telco-timestamp
    scope: document
    severity: MUST
    category: Freshness
    citation: "OpenChain Telco v1.1 §4: Created (timestamp)"
    field: timestamp
    validators: [present, rfc3339_utc]

  - id: telco-component-name
    scope: component
    severity: MUST
    category: Completeness
    citation: "OpenChain Telco v1.1 §4: Package Name"
    field: name
    validators: [present, non_placeholder]

  - id: telco-component-version
    scope: component
    severity: MUST
    category: Completeness
    citation: "OpenChain Telco v1.1 §4: Package Version"
    field: version
    validators: [present, non_placeholder]

  - id: telco-component-supplier
    scope: component
    severity: MUST
    category: Completeness
    citation: "OpenChain Telco v1.1 §4: Package Supplier"
    field: supplier
    validators: [present, non_placeholder]

  - id: telco-component-identifier
    scope: component
    severity: MUST
    category: Completeness
    citation: "OpenChain Telco v1.1 §4: SPDXID / Package unique identifier"
    field: purl
    validators: [present, purl_wellformed]

  - id: telco-component-license-concluded
    scope: component
    severity: MUST
    category: Accuracy
    citation: "OpenChain Telco v1.1 §4: Concluded License (SPDX License Expression)"
    field: licenses
    validators: [present, spdx_license_expression]

scoring:
  weights:
    Completeness: 0.35
    Accuracy: 0.25
    Consistency: 0.15
    Provenance: 0.15
    Freshness: 0.10
  thresholds:
    version_coverage_min: 0.95
    license_normalization_min: 0.95
