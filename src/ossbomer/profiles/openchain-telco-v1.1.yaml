id: openchain-telco-v1.1
name: OpenChain Telco SBOM Quality v1.1
version: "1.1"
sources:
  - name: OpenChain Project
    ref: "OpenChain Telco SBOM Guide Version 1.1, §3.1 (Data Format) and §3.2 (SPDX Elements to be included). §4 is the conformant notice and specifies no data fields."
    url: https://github.com/OpenChain-Project/Telco-WG
  - name: OpenChain Project
    ref: "OpenChain Telco SBOM Guide v1.1 §3.1 (Data Format: SPDX)"
    url: https://raw.githubusercontent.com/OpenChain-Project/Telco-WG/main/OpenChain-Telco-SBOM-Guide_EN.md

schema:
  min_versions:
    spdx: "2.3"

rules:
  - id: telco-author
    scope: document
    severity: MUST
    category: Provenance
    citation: "OpenChain Telco v1.1 §3.2: Creator (PersonName or OrganizationName)"
    field: creators
    validators: [present, non_placeholder]

  - id: telco-timestamp
    scope: document
    severity: MUST
    category: Freshness
    citation: "OpenChain Telco v1.1 §3.2: Created (timestamp)"
    field: timestamp
    validators: [present, rfc3339_utc]

  - id: telco-component-name
    scope: component
    severity: MUST
    category: Completeness
    citation: "OpenChain Telco v1.1 §3.2: Package Name"
    field: name
    validators: [present, non_placeholder]

  - id: telco-component-version
    scope: component
    severity: MUST
    category: Completeness
    citation: "OpenChain Telco v1.1 §3.2: Package Version"
    field: version
    validators: [present, non_placeholder]

  - id: telco-component-supplier
    scope: component
    severity: MUST
    category: Completeness
    citation: "OpenChain Telco v1.1 §3.2: Package Supplier"
    field: supplier
    validators: [present, non_placeholder]

  - id: telco-component-identifier
    scope: component
    # "A package SHOULD be identified by a Package URL (PURL)". SHOULD, not
    # REQUIRED -- the REQUIRED identifier in 3.2 is SPDXID, which every SPDX
    # document carries by construction.
    severity: SHOULD
    category: Completeness
    citation: "OpenChain Telco v1.1 §3.2: a package SHOULD be identified by a PURL"
    field: purl
    validators: [present, purl_wellformed]

  - id: telco-component-license-concluded
    scope: component
    severity: MUST
    category: Accuracy
    citation: "OpenChain Telco v1.1 §3.2: Concluded License (SPDX License Expression)"
    field: licenses
    validators: [present, spdx_license_expression]

scoring:
  weights:
    Completeness: 0.35
    Accuracy: 0.25
    Consistency: 0.15
    Provenance: 0.15
    Freshness: 0.10
  thresholds:
    version_coverage_min: 0.95
    license_normalization_min: 0.95

# Coverage, stated plainly. 3.2 lists seventeen REQUIRED items. Six have a rule
# here: Creator, Created, PackageName, PackageVersion, PackageSupplier and
# PackageLicenseConcluded.
#
# Most of the rest are marked "mandatory in SPDX", so a document that parses as
# valid SPDX carries them by construction and the schema layer already covers
# them: SPDXVersion, DataLicense, SPDXID, DocumentName, DocumentNamespace,
# PackageDownloadLocation.
#
# Four are genuinely unchecked, because SPDX does not force them:
#   - CreatorComment, which is where 3.5 SBOM Build information goes
#   - PackageLicenseDeclared  (mandatory in 2.2, optional in 2.3)
#   - PackageCopyrightText    (mandatory in 2.2, optional in 2.3)
#   - Relationship, at least DESCRIBES and CONTAINS
# The last two matter most: copyright text and declared licence are what an
# attribution notice is built from, and this profile passes without them.
#
# 3.1 also restricts the format to SPDX 2.2 or 2.3 only. This profile sets an
# SPDX floor but cannot express "SPDX and nothing else", so a CycloneDX document
# passes here while being non-conformant to the Guide. Fixing that needs a way
# to declare permitted formats, which the profile schema does not have yet.
